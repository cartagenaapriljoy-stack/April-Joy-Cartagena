<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>April Joy Cartagena | Student Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --ink: #19332d;
            --muted: #71817b;
            --forest: #24594a;
            --forest-dark: #193f35;
            --coral: #d9674e;
            --sun: #f1c75b;
            --paper: #ffffff;
            --line: #e3eae5;
            --page: #eef3ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background-color: var(--page);
            background-image: radial-gradient(#cbd8ce 0.7px, transparent 0.7px);
            background-size: 18px 18px;
            font-family: "DM Sans", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        .page-shell {
            width: min(1080px, calc(100% - 48px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 18px;
            border-bottom: 1px solid #cfdad2;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 5px;
            background: var(--forest-dark);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 700;
        }

        .brand-caption,
        .header-index,
        .eyebrow,
        .panel-index {
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .brand-caption {
            display: block;
            margin-top: 3px;
            font-size: 9px;
        }

        .header-index {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .header-index span {
            width: 6px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--coral);
        }

        .intro {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            padding: 45px 0 35px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 12px;
            color: var(--forest);
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-family: Fraunces, Georgia, serif;
            font-size: 52px;
            font-weight: 500;
            line-height: 1.05;
        }

        h1 span {
            color: var(--forest);
        }

        .intro-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px 10px 10px;
            border: 1px solid #d8e1db;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.55);
        }

        .year-mark {
            display: grid;
            width: 38px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 4px;
            background: var(--sun);
            color: var(--ink);
            font-weight: 700;
        }

        .intro-meta p {
            font-size: 11px;
            font-weight: 700;
            line-height: 1.6;
        }

        .intro-meta small {
            color: var(--muted);
            font-size: 9px;
            font-weight: 600;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.8fr);
            gap: 18px;
        }

        .panel {
            min-width: 0;
            padding: 26px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--paper);
            box-shadow: 0 12px 32px rgba(25, 63, 53, 0.045);
            animation: rise-in 420ms ease-out both;
        }

        .greeting-panel {
            background: var(--forest-dark);
            color: #fff;
            animation-delay: 90ms;
        }

        .panel-heading {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
        }

        .panel-index {
            display: block;
            margin-bottom: 7px;
            color: var(--forest);
        }

        .greeting-panel .panel-index {
            color: #a9c7b8;
        }

        h2 {
            font-family: Fraunces, Georgia, serif;
            font-size: 25px;
            font-weight: 500;
        }

        .panel-mark {
            width: 11px;
            aspect-ratio: 1;
            margin-top: 4px;
            border-radius: 3px;
            background: var(--coral);
            transform: rotate(45deg);
        }

        .greeting-panel .panel-mark {
            background: var(--sun);
        }

        .action-button {
            min-height: 44px;
            padding: 0 16px;
            border: 0;
            border-radius: 4px;
            background: var(--forest);
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        .action-button:hover {
            background: var(--forest-dark);
            transform: translateY(-1px);
        }

        .greeting-panel .action-button {
            background: var(--coral);
            color: #fff;
        }

        .greeting-panel .action-button:hover {
            background: #c7553d;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--sun);
            outline-offset: 3px;
        }

        #result {
            display: grid;
            min-height: 163px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-content: start;
            gap: 0 20px;
            margin-top: 20px;
            border-top: 1px solid var(--line);
        }

        #result:empty::before {
            align-self: center;
            grid-column: 1 / -1;
            margin-top: 20px;
            padding: 14px 16px;
            border-left: 3px solid var(--sun);
            background: #f5f8f5;
            color: var(--muted);
            content: "Student details will appear here.";
            font-size: 12px;
        }

        #result p {
            min-width: 0;
            padding: 13px 0 11px;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #result b {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 9px;
            font-weight: 700;
        }

        .name-input {
            width: 100%;
            height: 46px;
            margin-bottom: 10px;
            padding: 0 13px;
            border: 1px solid #58796d;
            border-radius: 4px;
            background: #214a3e;
            color: #fff;
            font-size: 13px;
        }

        .name-input::placeholder {
            color: #c0d1c8;
            opacity: 1;
        }

        .greeting-output {
            min-height: 52px;
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid #58796d;
            color: #f2c75a;
            font-family: Fraunces, Georgia, serif;
            font-size: 21px;
        }

        .page-footer {
            display: flex;
            justify-content: space-between;
            padding-top: 18px;
            color: var(--muted);
            font-size: 10px;
        }

        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 720px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .greeting-panel {
                animation-delay: 0ms;
            }
        }

        @media (max-width: 480px) {
            .page-shell {
                width: min(100% - 32px, 420px);
                padding-top: 18px;
            }

            .intro {
                align-items: start;
                flex-direction: column;
                gap: 18px;
                padding: 34px 0 24px;
            }

            h1 {
                font-size: 42px;
            }

            .panel {
                padding: 21px 18px;
            }

            #result {
                grid-template-columns: 1fr;
            }

            .header-index {
                font-size: 9px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="page-shell">
        <header class="site-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">AC</span>
                <span class="brand-name">April Joy Cartagena
                    <span class="brand-caption">STUDENT PORTAL</span>
                </span>
            </div>
            <div class="header-index"><span aria-hidden="true"></span> PERSONAL SPACE</div>
        </header>

        <section class="intro" aria-labelledby="page-title">
            <div>
                <span class="eyebrow">STUDENT PROFILE / 2026</span>
                <h1 id="page-title">April Joy<br><span>Cartagena.</span></h1>
            </div>
            <div class="intro-meta">
                <span class="year-mark">03</span>
                <p>BSIT<br><small>HAMILTON</small></p>
            </div>
        </section>

        <section class="dashboard-grid" aria-label="Student tools">
            <article class="panel profile-panel" aria-labelledby="profile-title">
                <div class="panel-heading">
                    <div>
                        <span class="panel-index">01 / PROFILE</span>
                        <h2 id="profile-title">Student details</h2>
                    </div>
                    <span class="panel-mark" aria-hidden="true"></span>
                </div>

                <button class="action-button" onclick="loadStudent()">
                    Load student information
                </button>
                <div id="result" aria-live="polite"></div>
            </article>

            <article class="panel greeting-panel" aria-labelledby="greeting-title">
                <div class="panel-heading">
                    <div>
                        <span class="panel-index">02 / MESSAGE</span>
                        <h2 id="greeting-title">Say hello</h2>
                    </div>
                    <span class="panel-mark" aria-hidden="true"></span>
                </div>

                <input class="name-input" type="text" id="nameInput"
                       placeholder="Enter your first name" aria-label="Your first name">
                <button class="action-button" onclick="sayHello()">Send greeting</button>
                <p class="greeting-output" id="greeting" aria-live="polite"></p>
            </article>
        </section>

        <footer class="page-footer">
            <span>APRIL JOY CARTAGENA</span>
            <span>BSIT / HAMILTON</span>
        </footer>
    </main>

    <script>
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>' +
                        '<p><b>Hobbies:</b> ' + data.hobbies + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p>Unable to retrieve data.</p>';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText =
                        data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }
    </script>
</body>
</html>
